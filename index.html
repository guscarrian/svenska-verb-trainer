<!DOCTYPE html>
<!-- Basic setup instructions -->  
<html lang="sv">
<head>
  <meta charset="UTF-8"> <!-- This encoding ensures special characters in swedish like å, ä and ö -->
  <title>Svenska Verbformer Tränare</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- Adding body and setting up header and å, ä, ö buttons --> 
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header --> 
    <header class="text-center space-y-1">
      <!-- Swedish Verb Forms (Tenses) --> 
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">🇸🇪 Svenska Verbformer</h1>
      <!-- Fill in the missing verb forms and test your knowledge --> 
      <p class="text-slate-600 text-sm">Fyll i de saknade verbformerna och testa dina kunskaper.</p>
    </header>

    <!-- Character buttons --> 
    <div class="bg-white border border-slate-200 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 shadow-sm">
      <div class="flex items-center gap-2">
        <!-- Special characters -->
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Specialtecken:</span>
        <div class="flex gap-1.5">
          <button type="button" onclick="insertChar('å')" class="px-3 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-300 font-bold rounded-lg text-sm transition">å</button>
          <button type="button" onclick="insertChar('ä')" class="px-3 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-300 font-bold rounded-lg text-sm transition">ä</button>
          <button type="button" onclick="insertChar('ö')" class="px-3 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-300 font-bold rounded-lg text-sm transition">ö</button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <!-- Instead of hard-coding a tabke with X number of rows manually in HTML, it's smarter to write only the -->
    <!-- table headers in HTML. If we leave the body empty, we can use Javascript to dinamically generate the -->
    <!-- rows we need from our verb list (below) -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 font-bold">
              <th class="p-3 w-12 text-center text-slate-400">#</th>
              <!-- 5 main tense forms -->
              <th class="p-3">Imperativ</th>
              <th class="p-3">Infinitiv</th>
              <th class="p-3">Presens</th>
              <th class="p-3">Preteritum</th>
              <th class="p-3">Supinum</th>
            </tr>
          </thead>
          <tbody id="verb-tense-forms" class="divide-y divide-slate-100">
            <!-- JavaScript will insert the rows here -->
          </tbody>
        </table>
      </div>

      <!-- Action buttons and test score footer -->
      <div class="p-4 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-4">
        <!-- Status: Not yet corrected -->
        <div id="test-score" class="text-sm font-semibold text-slate-700">
          Status: Inte rättat ännu
        </div>
        <div class="flex flex-wrap gap-2">
          <!-- Button -> Shuffle/New round -->
          <button type="button" onclick="resetPractice()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-xl transition">
            Blanda om / Ny omgång
          </button>
          <!-- Button -> Show answers -->
          <button type="button" onclick="showAnswers()" class="px-4 py-2 text-sm font-semibold bg-amber-500 hover:bg-amber-600 text-white rounded-xl shadow-sm transition">
            Visa svar
          </button>
          <!-- Button -> Correct answers -->
          <button type="button" onclick="checkAnswers()" class="px-5 py-2 text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm transition">
            Rätta svar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- List of verbs and tenses -->
  <script>
    const verbDatabase = [
      { imperativ: "drick", infinitiv: "dricka", presens: "dricker", preteritum: "drack", supinum: "druckit" },
      { imperativ: "ät", infinitiv: "äta", presens: "äter", preteritum: "åt", supinum: "ätit" },
      { imperativ: "skriv", infinitiv: "skriva", presens: "skriver", preteritum: "skrev", supinum: "skrivit" },
      { imperativ: "bo", infinitiv: "bo", presens: "bor", preteritum: "bodde", supinum: "bott" }
      // TO DO: Add the rest of verbs from the list
    ];

    const tenses = ["imperativ", "infinitiv", "presens", "preteritum", "supinum"];
    
    // currentSession stores the verbs shown on the screen and which tense was chosen as the clue for each
    let currentSession = [];

    // To manage the special characters (å, ä and ö):
    // activeInput remembers which <input> box the cursor was last inside, so when if you click on any of 
    // the special characters they are inserted into the correct box
    let activeInput = null;
    // when you click or type any text input with the class verb-input
    // that input field is saved to activeInput
    document.addEventListener("focusin", (e) => {
      if (e.target.classList.contains("verb-input")) {
        activeInput = e.target;
      }
    });

    // First check if the input is active and checks where the blinking cursor
    // is using selectionStart and selectionEnd
    function insertChar(char) {
      if (!activeInput) return;
      const start = activeInput.selectionStart;
      const end = activeInput.selectionEnd;
      const val = activeInput.value;
      
      // Then the text is splitted in half and the scpecial chars
      // are added in between. The cursor then moves forward by 1 char
      activeInput.value = val.substring(0, start) + char + val.substring(end);
      activeInput.focus();
      activeInput.setSelectionRange(start + 1, start + 1);
    }


    // To generate the table dynamically:
    // We need a function to run automatically when the page loads
    // and also when the user clicks on the button Blanda om
    function initTable() {
      const tbody = document.getElementById("verb-tense-forms");
      tbody.innerHTML = ""; // To clear any old rows
      
      // First we shuffle the database of verbs and randomly pick 10 (it can be adjusted for more or less verbs)
      const shuffled = [...verbDatabase].sort(() => 0.5 - Math.random()).slice(0, 10);
      currentSession = [];

      // Then we loop over each verb
      shuffled.forEach((verb, index) => {
        // and pick one random tense
        const clueTense = tenses[Math.floor(Math.random() * tenses.length)];
        currentSession.push({ verb, clueTense });

        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition";

        let html = `<td class="p-3 text-center text-xs text-slate-400 font-mono">${index + 1}</td>`;

        // We create 5 table cells, one for each tense
        tenses.forEach(tense => {
          if (tense === clueTense) {
            // If this is the clue tense, show it as static highlighted text
            html += `
              <td class="p-2.5">
                <span class="inline-block w-full py-1.5 px-2 bg-indigo-50 text-indigo-900 font-semibold rounded-lg border border-indigo-100">
                  ${verb[tense]}
                </span>
              </td>`;
          } else {
            // otherwise, make it a blank text box for the user to type in
            html += `
              <td class="p-2.5">
                <input 
                  type="text" 
                  data-row="${index}" 
                  data-tense="${tense}" 
                  autocomplete="off"
                  class="verb-input w-full py-1.5 px-2 bg-white border border-slate-300 rounded-lg text-slate-900 font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none transition text-sm"
                  placeholder="..."
                />
              </td>`;
          }
        });

        tr.innerHTML = html;
        tbody.appendChild(tr);
      });

      document.getElementById("test-score").textContent = "Status: Fyll i fälten och klicka på 'Rätta svar'."; //Status: Fill in the fields and click 'Check answers'.
    }


 

  
  </script> 
  
  <!--

  - Checking user's answer -- rätta svar
  - Showing answers
  - reset page?
  -->


</body>
</html>
